# Nightly meta-eval: is GEL itself still right?
# 1. every guard against its labelled cases (recall, precision, false blocks)
# 2. the bench on 30 pinned public repos, clean and planted
# 3. the ratchet: fail when the bench is worse than bench/baseline.json
# A change to the baseline or to any cases.json is lane C: a person approves it, the loop never does.
name: Meta-eval
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-eval
  cancel-in-progress: false
jobs:
  meta-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Guards against their cases
        run: |
          node bin/gel.mjs selftest --json > "$RUNNER_TEMP/selftest.json"
          node bin/gel.mjs selftest | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bench on 30 public repos
        run: node bench/run.mjs --out "$RUNNER_TEMP/results.json"
      - name: Not worse than the baseline
        run: node bench/check.mjs --results "$RUNNER_TEMP/results.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: meta-eval
          path: |
            ${{ runner.temp }}/selftest.json
            ${{ runner.temp }}/results.json
          if-no-files-found: ignore
          retention-days: 90
