# GEL checks itself: the guards are evaluated against their labelled cases, then run on this repo.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node bin/gel.mjs selftest
      - run: node --test tests/*.test.mjs
      - run: node bin/gel.mjs run
